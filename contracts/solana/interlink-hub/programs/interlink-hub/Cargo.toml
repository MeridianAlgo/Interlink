[package]
name = "interlink-hub"
version = "0.1.0"
description = "High-Performance ZK-SNARK Hub for InterLink Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "interlink_hub"

[features]
default = ["init-if-needed"]
init-if-needed = ["anchor-lang/init-if-needed"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "=1.18.26"

# Host-only: cross-check field arithmetic and run a real Groth16 proof
# through the on-chain verifier.
[dev-dependencies]
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
