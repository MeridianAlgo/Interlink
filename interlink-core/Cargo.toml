[package]
name = "interlink-core"
version = "0.4.0"
edition = "2021"

[dependencies]
# ZK Proving
halo2_proofs = { version = "0.3.0", features = ["multicore"] }
halo2curves = "0.1.0"
ff = "0.13"

serde = { version = "1.0", features = ["derive"] }
sha3 = "0.10"

[dev-dependencies]
# For testing circuits
halo2_proofs = { version = "0.3.0", features = ["dev-graph", "multicore"] }
